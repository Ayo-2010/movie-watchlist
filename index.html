<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Watchlist</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="eyebrow">Personal cinema</p>
      <h1>Watchlist</h1>
      <p class="sub">Films to see, films seen.</p>
    </div>
    <div class="stats">
      <div><span id="wantCount">0</span><small>to watch</small></div>
      <div><span id="watchedCount">0</span><small>watched</small></div>
    </div>
  </header>

  <form id="addForm" class="add-form">
    <input id="titleInput" placeholder="Film title" maxlength="60" autocomplete="off">
    <input id="yearInput" type="number" placeholder="Year" min="1888" max="2100">
    <select id="genreInput">
      <option>Drama</option>
      <option>Comedy</option>
      <option>Thriller</option>
      <option>Sci-Fi</option>
      <option>Animation</option>
      <option>Action</option>
      <option>Horror</option>
      <option>Documentary</option>
      <option>Romance</option>
    </select>
    <button type="submit">Add film</button>
  </form>
  <p class="error" id="error" hidden></p>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all" type="button">All</button>
      <button class="tab" data-filter="want" type="button">To watch</button>
      <button class="tab" data-filter="watched" type="button">Watched</button>
    </div>
    <input type="search" id="search" placeholder="Search films">
  </div>

  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden>Nothing here yet. Add your first film above.</p>
</main>
<script src="script.js"></script>
</body>
</html>
